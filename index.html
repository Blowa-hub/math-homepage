  <style>
:root {
  --page: #f5f7fa;
  --paper: #ffffff;
  --ink: #1f2d3d;
  --muted: #5e6d7d;
  --blue: #2257a3;
  --line: #e1e7ee;
  --soft: #edf3fc;
  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 24px; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.8;
}
a { color: var(--blue); text-decoration: none; text-underline-offset: 4px; }
a:hover { text-decoration: underline; }
button, textarea { font: inherit; }
button { cursor: pointer; }
a, button, summary { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
::selection { background: #dbe8fb; }
[hidden] { display: none !important; }

.skip-link {
  position: fixed;
  left: 20px;
  top: -100px;
  z-index: 10;
  background: var(--blue);
  color: #fff;
  padding: 9px 16px;
}
.skip-link:focus { top: 12px; }

.topbar, .layout, .site-footer {
  max-width: 1180px;
  margin: 0 auto;
  background: var(--paper);
  border-inline: 1px solid #e8edf3;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  padding: 18px 44px;
  border-bottom: 1px solid var(--line);
}
.wordmark {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
  font-size: 14px;
  font-weight: 600;
}
.wordmark:hover { text-decoration: none; }
.brand-label { color: var(--muted); font-size: 10px; font-weight: 400; letter-spacing: .08em; }
.mark {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  background: var(--soft);
  border-radius: 4px;
  color: var(--blue);
  font-size: 11px;
  letter-spacing: .02em;
}
.topbar-right { display: flex; align-items: center; gap: 24px; }
.topbar nav { display: flex; align-items: center; gap: 24px; font-size: 13px; }
.topbar nav a { color: #4d5e74; }
.topbar nav a:hover { color: var(--blue); }
.language-button {
  min-width: 44px;
  min-height: 32px;
  padding: 3px 10px;
  border: 1px solid #cdd8e6;
  border-radius: 4px;
  background: #fff;
  color: #344862;
  font-size: 12px;
}
.language-button:hover { background: var(--soft); border-color: #9db8dd; }

.layout {
  display: grid;
  grid-template-columns: minmax(0, 232px) minmax(0, 1fr);
  gap: 62px;
  min-height: calc(100vh - 145px);
  padding: 42px 44px 36px;
}
.profile-panel { align-self: start; position: sticky; top: 30px; }
.eyebrow {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.6;
  letter-spacing: .12em;
}
.profile-panel h1 {
  margin: 0;
  font-size: 32px;
  line-height: 1.4;
  font-weight: 600;
  letter-spacing: .015em;
  overflow-wrap: anywhere;
}
.alternate-name {
  margin: 4px 0 22px;
  color: #46556c;
  font-family: var(--serif);
  font-size: 24px;
  line-height: 1.5;
}
.alternate-name:lang(zh) { font-family: var(--sans); font-size: 24px; }
.affiliation { margin: 0; font-size: 15px; line-height: 1.85; overflow-wrap: anywhere; }
.role { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.profile-research { margin-top: 24px; padding-top: 19px; border-top: 1px solid var(--line); }
.profile-caption { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
.profile-research .research-interests { display: block; margin-top: 0; padding-top: 0; border-top: 0; }
.profile-research .interest-tag { display: block; font-size: 14px; line-height: 1.9; }
.profile-research .interest-tag::after { content: none; }
.research-interests {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 10px;
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}
.interest-tag { color: #3e587b; font-size: 13px; line-height: 1.7; }
.interest-tag:not(:last-child)::after { content: " ·"; margin-left: 9px; color: var(--muted); }
.profile-links {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  margin-top: 20px;
  font-size: 14px;
  overflow-wrap: anywhere;
}
.profile-links a { display: inline-flex; align-items: center; gap: 7px; }
.external-arrow { color: var(--muted); font-size: 12px; }

.main-column { min-width: 0; }
.about-section { padding: 0 0 30px; }
.about-section > h2, .section-heading {
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
}
.about-section h2, .section-heading h2 {
  margin-top: 0;
  color: #1c2c42;
  font-family: var(--sans);
  font-size: 21px;
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: 0;
}
.section-heading h2 { margin-bottom: 0; }
.section-subtitle {
  display: inline-block;
  margin-left: 10px;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 400;
  line-height: 1.6;
  letter-spacing: 0;
}
.bio { margin: 0; font-size: 15px; line-height: 1.9; color: #3f4d60; }
.alternate-bio { margin: 13px 0 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
.bio + .bio { margin-top: 12px; }
.about-section .research-interests { margin-top: 16px; padding-top: 0; border: 0; }
.text-link { display: inline-flex; align-items: center; gap: 9px; font-size: 14px; }
.publications-section { padding-top: 0; }
.section-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.section-heading .eyebrow { margin-bottom: 6px; }
.paper-count { color: var(--muted); font-size: 13px; white-space: nowrap; }
.section-intro { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.8; }

.category-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  margin: 0 0 24px;
  font-size: 13px;
}
.category-nav a { padding-bottom: 3px; border-bottom: 1px solid #b5cbe7; }
.category-nav a:hover { border-color: var(--blue); text-decoration: none; }
.category-heading { display: flex; align-items: baseline; gap: 9px; margin-bottom: 10px; }
.category-heading h3 { margin: 0; color: #30435c; font-size: 16px; font-weight: 600; line-height: 1.6; }
.category-count { color: var(--muted); font-size: 12px; line-height: 1.5; }
.category-count::before { content: "("; }
.category-count::after { content: ")"; }
.paper-category + .paper-category { margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--line); }
.paper-category.is-empty { display: flex; flex-wrap: wrap; align-items: baseline; gap: 16px; }
.paper-category.is-empty .category-heading { margin-bottom: 0; }
.paper-category.is-empty .category-empty { padding: 0; }
.category-empty, .empty-state { margin: 0; padding: 4px 0 10px; font-size: 14px; color: var(--muted); }

.year-group { margin: 0; padding: 0; }
.year-group + .year-group { margin-top: 24px; }
.year-label {
  margin: 0 0 14px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.5;
}
.year-label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.paper { padding: 0 0 20px; }
.paper + .paper { padding-top: 20px; border-top: 1px solid var(--line); }
.paper:last-child { padding-bottom: 0; }
.paper-title {
  margin: 0 0 7px;
  color: #192f4b;
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 600;
  line-height: 1.55;
  overflow-wrap: anywhere;
}
.paper-title a { color: inherit; }
.paper-title a:hover { color: var(--blue); }
.authors { margin: 0 0 6px; color: var(--muted); font-size: 14.5px; line-height: 1.7; }
.authors strong { color: #283a52; font-weight: 600; }
.publication-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px 12px;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}
.status-badge { color: #405c82; font-size: 12px; }
.nonpublic-badge { color: #7b592b; }
.nonpublic-note { color: #645f56; font-size: 12px; line-height: 1.7; }
.paper-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; }
.paper-link, .cite-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 32px;
  padding: 3px 0;
  border: 0;
  border-bottom: 1px solid #b5cbe7;
  border-radius: 0;
  background: transparent;
  color: var(--blue);
  font-size: 13px;
  line-height: 1.6;
}
.paper-link:hover, .cite-button:hover { border-color: var(--blue); text-decoration: none; }
.paper-link[data-kind="pdf"] {
  padding: 3px 11px;
  border: 1px solid #d1e0f4;
  border-radius: 4px;
  background: var(--soft);
  color: #1b4c94;
  font-weight: 600;
}
.paper-link[data-kind="pdf"]:hover { background: #dfeafa; border-color: #a9c4e7; }
.cite-button { border-bottom-style: dotted; }
.abstract { margin-top: 12px; color: #4d5e73; font-size: 14px; line-height: 1.85; }
.abstract summary { width: fit-content; color: var(--muted); font-size: 13px; cursor: pointer; list-style-position: inside; }
.abstract summary:hover { color: var(--blue); }
.abstract p {
  margin: 10px 0 0;
  padding: 11px 15px;
  border-left: 2px solid #cbdcf2;
  background: #f7f9fc;
  overflow-wrap: anywhere;
}

footer {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 12px;
  padding: 20px 44px 26px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
}
.footer-separator { color: var(--muted); }
.footer-links { display: flex; flex-wrap: wrap; gap: 16px; margin-left: auto; }
.footer-links a { font-size: 12px; }

dialog {
  width: min(650px, calc(100% - 32px));
  padding: 26px;
  border: 1px solid #cbd7e5;
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  box-shadow: 0 20px 70px #1f385e26;
}
dialog::backdrop { background: #152b4659; }
.dialog-heading { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.dialog-heading h2 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.5; }
.close-button { padding: 3px 9px; border: 0; background: transparent; color: var(--muted); font-size: 28px; line-height: 1; }
.citation-note { margin: 18px 0 8px; color: var(--muted); font-size: 13px; }
#citation-text {
  width: 100%;
  min-height: 230px;
  resize: vertical;
  padding: 14px;
  border: 1px solid #d4deeb;
  border-radius: 4px;
  background: #f7f9fc;
  color: var(--ink);
  font: 13px/1.7 ui-monospace, Consolas, monospace;
}
.dialog-bottom { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 16px; }
.dialog-bottom p { margin: 0; color: var(--muted); font-size: 13px; }
.primary-button { flex-shrink: 0; min-height: 36px; padding: 6px 15px; border: 1px solid var(--blue); border-radius: 4px; background: var(--blue); color: #fff; font-size: 13px; }
.primary-button:hover { background: #194784; border-color: #194784; }

@media (max-width: 1080px) {
  .topbar, .site-footer { padding-inline: 32px; }
  .layout { grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 42px; padding: 36px 32px; }
  .profile-panel h1 { font-size: 30px; }
  .alternate-name { font-size: 23px; }
  .paper-title { font-size: 19px; }
}

@media (max-width: 850px) {
  body { background: #fff; }
  .topbar, .layout, .site-footer { border-inline: 0; }
  .topbar { padding: 16px 28px; }
  .layout { display: block; padding: 30px 28px; }
  .site-footer { padding-inline: 28px; }
  .profile-panel {
    position: static;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, .9fr);
    column-gap: 28px;
    padding-bottom: 24px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--line);
  }
  .profile-panel > .eyebrow { grid-column: 1 / -1; margin-bottom: 9px; }
  .profile-panel h1 { grid-column: 1; font-size: 30px; }
  .alternate-name { grid-column: 1; margin: 2px 0 0; font-size: 23px; }
  .affiliation { grid-column: 2; grid-row: 2 / 4; align-self: center; font-size: 14px; }
  .role { grid-column: 2; margin-top: 5px; }
  .profile-panel .research-interests { grid-column: 1 / -1; margin-top: 16px; padding-top: 0; border: 0; }
  .profile-panel .profile-research { grid-column: 1 / -1; margin-top: 16px; padding-top: 0; border: 0; }
  .profile-panel .profile-research .research-interests { margin-top: 0; display: flex; gap: 5px 16px; }
  .profile-links { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
  .about-section { padding-bottom: 26px; }
  .paper-title { font-size: 20px; }
}

@media (max-width: 550px) {
  .topbar { flex-wrap: wrap; gap: 10px 16px; padding: 14px 20px; }
  .wordmark { font-size: 13px; gap: 8px; }
  .topbar-right { margin-left: auto; gap: 16px; }
  .topbar nav { gap: 16px; font-size: 12px; }
  .language-button { font-size: 12px; min-width: 40px; padding-inline: 8px; }
  .layout { padding: 26px 20px; }
  .site-footer { padding-inline: 20px; }
  .profile-panel { display: block; padding-bottom: 22px; margin-bottom: 24px; }
  .profile-panel h1 { font-size: 30px; }
  .alternate-name { margin: 2px 0 12px; font-size: 22px; }
  .affiliation { font-size: 14px; }
  .profile-panel .research-interests { margin-top: 14px; }
  .profile-panel .profile-research .research-interests { margin-top: 0; }
  .profile-links { margin-top: 12px; font-size: 13px; gap: 8px 18px; }
  .about-section h2, .section-heading h2 { font-size: 20px; }
  .section-subtitle { margin-left: 8px; font-size: 14px; }
  .section-heading { gap: 12px; }
  .paper-count { font-size: 12px; }
  .category-nav { gap: 20px; margin-bottom: 20px; }
  .paper-title { font-size: 19px; }
  .paper-actions { gap: 8px 14px; }
  .paper + .paper { padding-top: 19px; }
  .paper { padding-bottom: 19px; }
  .abstract p { padding: 10px 12px; }
  .footer-links { margin-left: 0; flex-basis: 100%; gap: 18px; }
  dialog { padding: 20px; }
  .dialog-heading h2 { font-size: 20px; }
  .dialog-bottom { align-items: flex-start; gap: 12px; }
}

@media (max-width: 360px) {
  .topbar nav { gap: 12px; }
  .section-subtitle { display: block; margin: 3px 0 0; }
  .section-heading { align-items: flex-start; }
}

@media (max-width: 420px) {
  .brand-label { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

@media print {
  body { background: #fff; font-size: 10.5pt; }
  .topbar, .skip-link, .category-nav, .paper-actions, footer, dialog { display: none !important; }
  .layout { display: grid; max-width: none; min-height: 0; padding: 0; border: 0; grid-template-columns: 185px minmax(0, 1fr); gap: 30px; }
  .profile-panel { display: block; position: static; border: 0; padding: 0; margin: 0; }
  .profile-panel h1 { font-size: 23pt; }
  .alternate-name { font-size: 17pt; }
  .affiliation, .bio, .authors { font-size: 10.5pt; }
  .profile-panel .research-interests { margin-top: 12px; }
  .profile-links { flex-direction: column; margin-top: 12px; }
  .section-heading h2, .about-section h2 { font-size: 14pt; }
  .section-subtitle { font-size: 10pt; }
  .paper-title { font-size: 12pt; }
  .paper { break-inside: avoid; }
  .abstract { display: none; }
  a { color: inherit; }
}

</style>

  <script src="publications.js" defer></script>

      <nav aria-label="Main navigation" data-aria="nav">
        <a href="#about" data-text="navAbout">研究</a>

  <main id="main" class="layout">

      <h1 id="profile-name">王鹏超</h1>
      <p id="alternate-name" class="alternate-name" lang="en">Pengchao Wang</p>
      <p id="affiliation" class="affiliation" lang="zh-CN">中国科学院系统与科学学院</p>

      <div class="profile-research"><p class="profile-caption" data-text="interestsLabel">研究方向</p><div id="research-interests" class="research-interests" hidden></div></div>
      <div id="profile-links" class="profile-links"></div>
    </aside>
    <div class="main-column">
      <section id="about" class="about-section" aria-labelledby="about-title">
        <div class="section-heading"><h2 id="about-title"><span data-text="aboutTitle">研究简介</span><span class="section-subtitle" data-text="aboutSubtitle" lang="en">Research</span></h2></div>

        <p id="alternate-bio" class="alternate-bio" lang="en" hidden></p>
      </section>

        <div class="section-heading"><h2 id="publications-title"><span data-text="papersTitle">论文</span><span class="section-subtitle" data-text="papersSubtitle" lang="en">Papers &amp; Preprints</span></h2><span id="paper-count" class="paper-count"></span></div>
        <p class="section-intro" data-text="papersIntro">完成版与草稿，提供 PDF 和 LaTeX 源码下载。</p>
        <nav class="category-nav" aria-label="论文分类" data-aria="categories"><a href="#completed-papers" data-text="completedTitle">完成版</a><a href="#draft-papers" data-text="draftsTitle">草稿</a></nav>
        <div id="publication-list"></div>

      </section>

<script>
document.addEventListener("DOMContentLoaded", () => {
(() => {
  "use strict";
  const profile = window.PROFILE || {};
  const papers = Array.isArray(window.PUBLICATIONS) ? window.PUBLICATIONS : [];
  const translations = {
